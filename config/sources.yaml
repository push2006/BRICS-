# NEWSBOT TEMPLATE — source list
# tier: 1 = wire/agency (near real-time), 2 = has RSS (poll every cycle),
#       3 = no reliable RSS (needs scraping — off by default, see collectors/official.py)
#
# enabled: false marks a source collectors/rss.py will skip entirely.
# Sources below were disabled because they kept failing even with the
# browser User-Agent + XML cleanup already in collectors/rss.py — meaning
# it's Cloudflare/WAF-level blocking (403/HTML-challenge) or a genuinely
# retired endpoint (404), not something a header fixes. Re-test by
# flipping enabled back to true and rerunning `python app.py collect`.
sources:
  # ---- India ----
  - {name: "The Hindu",            country: India,        tier: 2, type: rss, url: "https://www.thehindu.com/feeder/default.rss"}
  - {name: "NDTV Top Stories",     country: India,        tier: 2, type: rss, url: "https://feeds.feedburner.com/ndtvnews-top-stories"}
  - {name: "Times of India",       country: India,        tier: 2, type: rss, url: "https://timesofindia.indiatimes.com/rssfeeds/-2128936835.cms"}
  - {name: "Hindustan Times",      country: India,        tier: 2, type: rss, url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml"}

